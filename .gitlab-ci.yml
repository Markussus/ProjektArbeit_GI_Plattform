stages:
  - verify
  - build

default:
  image: node:22-bookworm-slim
  tags:
    - pi
  before_script:
    - cd app

cache:
  key:
    files:
      - app/package-lock.json
  paths:
    - app/.npm/

verify_pipeline:
  stage: verify
  script:
    - echo "Runner funktioniert"
    - pwd
    - ls -la
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

build_app:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build