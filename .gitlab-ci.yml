stages:
  - verify
  - quality
  - unit
  - build
  - lighthouse
  - e2e

default:
  image: node:22-bookworm-slim
  tags:
    - pi
  before_script:
    - cd app

cache:
  key:
    files:
      - app/package-lock.json
  paths:
    - app/.npm/
    - app/.cache/ms-playwright/

variables:
  NPM_CONFIG_CACHE: ".npm"
  PLAYWRIGHT_BROWSERS_PATH: ".cache/ms-playwright"
  CI: "true"

verify_pipeline:
  stage: verify
  script:
    - echo "Verify pipeline setup"
    - pwd
    - ls -la
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
    - npx vite --version
    - npx vitest --version
    - npx playwright --version
    - npx lhci --version

quality_checks:
  stage: quality
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run format:check
    - npm run lint

unit_tests:
  stage: unit
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test

build_app:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - app/dist/

lighthouse_check:
  stage: lighthouse
  needs:
    - job: build_app
      artifacts: true
  script:
    - npm ci --cache .npm --prefer-offline
    - apt-get update
    - apt-get install -y chromium
    - export CHROME_PATH=/usr/bin/chromium
    - npm run lhci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/.lighthouseci/

e2e_tests:
  stage: e2e
  needs:
    - job: build_app
      artifacts: true
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install chromium
    - npm run e2e:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/playwright-report/
      - app/test-results/
