stages:
  - verify
  - java-compiler
  - quality
  - unit
  - build
  - e2e
  - lighthouse

default:
  image: projektarbeit/node-24-npm-11:arm64
  tags:
    - pi
  before_script:
    - cd app

cache:
  key:
    files:
      - app/package-lock.json
  paths:
    - app/.npm/

variables:
  NPM_CONFIG_CACHE: ".npm"
  NPM_CONFIG_MIN_RELEASE_AGE: "7"
  NPM_CONFIG_ENGINE_STRICT: "true"
  CI: "true"

verify_pipeline:
  stage: verify
  script:
    - echo "Verify pipeline setup"
    - pwd
    - ls -la
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
    - npm run verify:signatures
    - npx vite --version
    - npx vitest --version
    - npx playwright --version
    - npx lhci --version

java_compiler:
  stage: java-compiler
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run prepare:java-compiler
    - test -f public/java/compiler/compiler.wasm
    - test -f public/java/compiler/worker.js
    - test -f public/java/compiler/.teavm-javac-commit
  artifacts:
    expire_in: 1 week
    paths:
      - app/public/java/compiler/

quality_checks:
  stage: quality
  dependencies:
    - java_compiler
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run format:check
    - npm run lint

unit_tests:
  stage: unit
  dependencies:
    - java_compiler
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test

build_app:
  stage: build
  dependencies:
    - java_compiler
  script:
    - npm ci --cache .npm --prefer-offline
    - test -f public/java/compiler/compiler.wasm
    - test -f public/java/compiler/worker.js
    - npm run build:app
    - test -f dist/java/compiler/compiler.wasm
    - test -f dist/java/compiler/worker.js
  artifacts:
    expire_in: 1 week
    paths:
      - app/dist/

lighthouse_check:
  stage: lighthouse
  image: projektarbeit/ci-browser:arm64
  needs:
    - job: build_app
      artifacts: true
    - job: e2e_tests
      artifacts: false
  before_script:
    - cd app
  script:
    - npm ci --cache .npm --prefer-offline
    - export CHROME_PATH=/usr/bin/chromium
    - npm run lhci:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/.lighthouseci/

e2e_tests:
  stage: e2e
  image: projektarbeit/ci-browser:arm64
  needs:
    - job: build_app
      artifacts: true
  before_script:
    - cd app
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run e2e:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/playwright-report/
      - app/test-results/
