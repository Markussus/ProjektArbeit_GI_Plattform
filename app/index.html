<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trainings Center</title>

    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      (() => {
        try {
          // Apply the persisted theme before React mounts to avoid a light/dark flash.
          const storageKey = "theme-storage";
          const raw = localStorage.getItem(storageKey);

          let theme = "system";

          if (raw) {
            const parsed = JSON.parse(raw);
            const storedTheme = parsed?.state?.theme;

            if (
              storedTheme === "light" ||
              storedTheme === "dark" ||
              storedTheme === "system"
            ) {
              theme = storedTheme;
            }
          }

          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const resolvedTheme =
            theme === "system" ? (prefersDark ? "dark" : "light") : theme;

          document.documentElement.classList.toggle(
            "dark",
            resolvedTheme === "dark",
          );
          document.documentElement.style.colorScheme = resolvedTheme;

          // Apply persisted font before React mounts
          const fontRaw = localStorage.getItem("font-storage");
          if (fontRaw) {
            const parsedFont = JSON.parse(fontRaw);
            if (parsedFont?.state?.font === "geist") {
              document.documentElement.dataset.font = "geist";
            } else {
              document.documentElement.dataset.font = "inter";
            }
          } else {
            document.documentElement.dataset.font = "inter";
          }
        } catch {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
